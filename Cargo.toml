[package]
name = "spoa"
version = "0.3.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
nom = "8.0"
semver = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"

[dev-dependencies]
anyhow = "1"
socket2 = "0.6"
tracing-subscriber = "0.3"

[[example]]
name = "server"
path = "examples/server.rs"

[[example]]
name = "minimal"
path = "examples/minimal.rs"

[[example]]
name = "stats"
path = "examples/stats.rs"
